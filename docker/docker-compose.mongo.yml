# Optional persistent database: use together with docker-compose.yml.
# Set MONGO_DB_URL=mongodb://mongo:27017/bpmn in .env, then:
# docker compose -f docker-compose.yml -f docker-compose.mongo.yml up -d
services:
  server:
    depends_on:
      mongo:
        condition: service_healthy
  mongo:
    image: mongo:8.0
    environment:
      GLIBC_TUNABLES: "glibc.pthread.rseq=1"
    command: ["--wiredTigerCacheSizeGB", "0.5"]
    volumes:
      - database:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
volumes:
  database:
