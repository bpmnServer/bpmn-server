name: bpmn-server
services:
  server:
    image: ${BPMN_IMAGE:-bpmnserver/bpmn-server:latest}
    ports:
      # Host port comes from local .env. The container always listens on 3000.
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      PORT: "3000"
    volumes:
      - processes:/app/processes
    restart: unless-stopped
volumes:
  processes:
