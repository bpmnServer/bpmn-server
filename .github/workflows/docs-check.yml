# Checks the docs on every pull request that changes them. Nothing is deployed: docs.yml publishes, when a change reaches main.
#
#  - the site builds with `mkdocs build --strict`: a link to a page that is not there, a page left out of the navigation or a
#    bad redirect fails it (an anchor is not checked)
#  - the site map (docs/docs/map.md) is what `npm run map` makes from the navigation
#
# The generated features page is checked by Tests (`node scripts/features.mjs --check`), which also runs on pull requests.
name: Docs check

on:
  pull_request:
    paths: ['docs/**', '.github/workflows/docs.yml', '.github/workflows/docs-check.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # the versions docs.yml publishes with
      - run: pip install mkdocs==1.6.1 mkdocs-material==9.6.20 mkdocs-redirects==1.2.2
      - run: mkdocs build --strict
        working-directory: docs
      - name: The site map is the navigation's
        run: |
          python src/scripts/site-map.py
          git diff --exit-code -- docs/map.md || { echo "docs/docs/map.md is out of date: run npm run map in docs/ and commit it"; exit 1; }
        working-directory: docs
