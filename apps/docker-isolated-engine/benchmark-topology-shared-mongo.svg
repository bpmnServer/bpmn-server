<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Four tenant host and engine pairs sharing native MongoDB</title>
  <desc id="desc">Four isolated tenant host and engine Docker pairs use one native MongoDB service with separate databases.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#4979c6"/></marker></defs>
  <rect width="1200" height="620" fill="#fff"/><text x="45" y="48" font-family="Arial" font-size="28" font-weight="700" fill="#172033">Four tenants sharing native MongoDB</text><text x="45" y="78" font-family="Arial" font-size="16" fill="#526071">Each tenant keeps its host and engine isolated; MongoDB is shared with a separate database name per tenant.</text>
  <rect x="35" y="110" width="1130" height="450" rx="18" fill="#f6f8fb" stroke="#cbd4e0" stroke-width="2"/><text x="65" y="145" font-family="Arial" font-size="16" font-weight="700" fill="#526071">AWS Linux host</text>
  <rect x="70" y="175" width="450" height="75" rx="10" fill="#dce9fb" stroke="#4979c6" stroke-width="2"/><text x="295" y="220" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#172033">Tenant 1: host + engine containers</text>
  <rect x="70" y="270" width="450" height="75" rx="10" fill="#dce9fb" stroke="#4979c6" stroke-width="2"/><text x="295" y="315" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#172033">Tenant 2: host + engine containers</text>
  <rect x="70" y="365" width="450" height="75" rx="10" fill="#dce9fb" stroke="#4979c6" stroke-width="2"/><text x="295" y="410" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#172033">Tenant 3: host + engine containers</text>
  <rect x="70" y="460" width="450" height="75" rx="10" fill="#dce9fb" stroke="#4979c6" stroke-width="2"/><text x="295" y="505" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#172033">Tenant 4: host + engine containers</text>
  <rect x="745" y="285" width="300" height="115" rx="14" fill="#e1f2e5" stroke="#4c9a62" stroke-width="2"/><text x="895" y="330" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#172033">Native MongoDB</text><text x="895" y="360" text-anchor="middle" font-family="Arial" font-size="16" fill="#526071">127.0.0.1:27017</text><text x="895" y="383" text-anchor="middle" font-family="Arial" font-size="14" fill="#526071">tenant-specific databases</text>
  <g stroke="#4c9a62" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"><line x1="520" y1="212" x2="745" y2="320"/><line x1="520" y1="307" x2="745" y2="335"/><line x1="520" y1="402" x2="745" y2="350"/><line x1="520" y1="497" x2="745" y2="370"/></g>
  <text x="555" y="245" font-family="Arial" font-size="14" fill="#4c9a62">shared native database service</text>
</svg>
