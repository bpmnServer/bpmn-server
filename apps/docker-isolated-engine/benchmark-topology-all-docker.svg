<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">All-Docker Linux topology</title>
  <desc id="desc">The client reaches the host container, which reaches the engine container. Both containers reach MongoDB on the Compose network.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#4979c6"/></marker></defs>
  <rect width="1100" height="520" fill="#ffffff"/>
  <text x="50" y="52" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#172033">All-Docker Linux topology</text>
  <text x="50" y="82" font-family="Arial, sans-serif" font-size="16" fill="#526071">Host, engine, and MongoDB are isolated Compose services.</text>
  <rect x="40" y="130" width="1020" height="330" rx="18" fill="#f6f8fb" stroke="#cbd4e0" stroke-width="2"/>
  <text x="70" y="165" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#526071">Docker Compose network</text>
  <rect x="80" y="230" width="210" height="100" rx="12" fill="#dce9fb" stroke="#4979c6" stroke-width="2"/>
  <text x="185" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#172033">Host service</text>
  <text x="185" y="297" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#526071">host:3000</text>
  <rect x="445" y="230" width="210" height="100" rx="12" fill="#fff0dc" stroke="#e28a3b" stroke-width="2"/>
  <text x="550" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#172033">Engine service</text>
  <text x="550" y="297" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#526071">engine:3001</text>
  <rect x="810" y="230" width="210" height="100" rx="12" fill="#e1f2e5" stroke="#4c9a62" stroke-width="2"/>
  <text x="915" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#172033">Mongo service</text>
  <text x="915" y="297" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#526071">mongo:27017</text>
  <line x1="290" y1="280" x2="445" y2="280" stroke="#4979c6" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="655" y1="280" x2="810" y2="280" stroke="#4979c6" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="290" y1="315" x2="810" y2="380" stroke="#4c9a62" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
  <text x="335" y="260" font-family="Arial, sans-serif" font-size="14" fill="#4979c6">HTTP engine call</text>
  <text x="690" y="260" font-family="Arial, sans-serif" font-size="14" fill="#4979c6">Mongo connection</text>
  <text x="450" y="410" font-family="Arial, sans-serif" font-size="14" fill="#4c9a62">private Compose DNS and bridge network</text>
</svg>
