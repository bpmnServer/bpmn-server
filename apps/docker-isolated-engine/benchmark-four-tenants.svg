<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
  <title id="title">Four tenants with native shared MongoDB</title>
  <desc id="desc">Median and p95 latency for four tenant host and engine pairs sharing native MongoDB.</desc>
  <rect width="1100" height="650" fill="#fff"/><text x="55" y="48" font-family="Arial" font-size="28" font-weight="700" fill="#172033">Four tenants, shared native MongoDB</text><text x="55" y="78" font-family="Arial" font-size="16" fill="#526071">Four tenant host/engine pairs ran concurrently; 8 Docker containers total.</text>
  <line x1="120" y1="500" x2="1010" y2="500" stroke="#687386" stroke-width="2"/><line x1="120" y1="120" x2="120" y2="500" stroke="#687386" stroke-width="2"/>
  <g font-family="Arial" font-size="13" fill="#526071"><text x="90" y="505" text-anchor="end">0</text><text x="90" y="429" text-anchor="end">10</text><text x="90" y="353" text-anchor="end">20</text><text x="90" y="277" text-anchor="end">30</text><text x="90" y="201" text-anchor="end">40</text><text x="90" y="125" text-anchor="end">50 ms</text></g>
  <g stroke="#dce2ea"><line x1="120" y1="424" x2="1010" y2="424"/><line x1="120" y1="348" x2="1010" y2="348"/><line x1="120" y1="272" x2="1010" y2="272"/><line x1="120" y1="196" x2="1010" y2="196"/><line x1="120" y1="120" x2="1010" y2="120"/></g>
  <g fill="#4979c6"><rect x="180" y="347.8" width="55" height="152.2"/><rect x="400" y="352.8" width="55" height="147.2"/><rect x="620" y="352.8" width="55" height="147.2"/><rect x="840" y="350.9" width="55" height="149.1"/></g>
  <g fill="#e28a3b"><rect x="240" y="303.8" width="55" height="196.2"/><rect x="460" y="299.1" width="55" height="200.9"/><rect x="680" y="285.0" width="55" height="215.0"/><rect x="900" y="306.2" width="55" height="193.8"/></g>
  <g font-family="Arial" font-size="14" fill="#172033" text-anchor="middle"><text x="237" y="542">Tenant 1</text><text x="457" y="542">Tenant 2</text><text x="677" y="542">Tenant 3</text><text x="897" y="542">Tenant 4</text><text x="207" y="337">20.02</text><text x="267" y="293">25.82</text><text x="427" y="342">19.37</text><text x="487" y="289">26.43</text><text x="647" y="342">19.37</text><text x="707" y="275">28.28</text><text x="867" y="340">19.61</text><text x="927" y="296">25.50</text></g>
  <g font-family="Arial" font-size="14" fill="#172033"><rect x="455" y="590" width="16" height="16" fill="#4979c6"/><text x="479" y="604">Median</text><rect x="600" y="590" width="16" height="16" fill="#e28a3b"/><text x="624" y="604">p95</text></g>
</svg>
