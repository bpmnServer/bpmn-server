<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Native engine versus Docker engine latency</title>
  <desc id="desc">Median latency in milliseconds for host-to-engine and full host API measurements on AWS Linux.</desc>
  <rect width="1000" height="560" fill="#ffffff"/>
  <text x="50" y="48" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#172033">AWS Linux latency comparison</text>
  <text x="50" y="78" font-family="Arial, sans-serif" font-size="16" fill="#526071">Median latency; 100 timed requests after 20 warm-ups. Lower is faster.</text>
  <line x1="120" y1="430" x2="920" y2="430" stroke="#687386" stroke-width="2"/>
  <line x1="120" y1="110" x2="120" y2="430" stroke="#687386" stroke-width="2"/>
  <g font-family="Arial, sans-serif" font-size="13" fill="#526071">
    <text x="90" y="435" text-anchor="end">0</text>
    <text x="90" y="355" text-anchor="end">3</text>
    <text x="90" y="275" text-anchor="end">6</text>
    <text x="90" y="195" text-anchor="end">9</text>
    <text x="90" y="115" text-anchor="end">12 ms</text>
  </g>
  <g stroke="#dce2ea" stroke-width="1">
    <line x1="120" y1="350" x2="920" y2="350"/><line x1="120" y1="270" x2="920" y2="270"/><line x1="120" y1="190" x2="920" y2="190"/><line x1="120" y1="110" x2="920" y2="110"/>
  </g>
  <rect x="245" y="409.5" width="70" height="20.5" rx="4" fill="#4979c6"/>
  <rect x="325" y="407.6" width="70" height="22.4" rx="4" fill="#e28a3b"/>
  <rect x="645" y="126.3" width="70" height="303.7" rx="4" fill="#4979c6"/>
  <rect x="725" y="127.5" width="70" height="302.5" rx="4" fill="#e28a3b"/>
  <g font-family="Arial, sans-serif" font-size="15" fill="#172033" text-anchor="middle">
    <text x="320" y="470">Host-to-engine</text>
    <text x="720" y="470">Full host API</text>
    <text x="280" y="398">0.77</text><text x="360" y="396">0.84</text>
    <text x="680" y="116">11.39</text><text x="760" y="117">11.37</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="14" fill="#172033">
    <rect x="390" y="510" width="16" height="16" fill="#4979c6"/><text x="414" y="524">Native engine</text>
    <rect x="555" y="510" width="16" height="16" fill="#e28a3b"/><text x="579" y="524">Docker engine</text>
  </g>
</svg>
