name: bpmn-server-hrdemo-separated

services:
  host:
    build:
      context: ../..
      dockerfile: apps/docker-isolated-engine/Dockerfile
    image: ${BPMN_IMAGE:-bpmnserver-hrdemo:local}
    command: ["npm", "run", "serve"]
    depends_on:
      engine:
        condition: service_healthy
      mongo:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: "3000"
      MONGO_DB_URL: mongodb://mongo:27017/hrdemo
      DEFINITIONS_PATH: /workspace/apps/hrdemo/workflow/processes/
      ENGINE_AT: http://engine:3001
      ENGINE_KEY: ${ENGINE_KEY:?set ENGINE_KEY in .env}
      HR_API_BASE_URL: http://host:3000/api/hr
      HR_SERVICE_KEY: ${HR_SERVICE_KEY:?set HR_SERVICE_KEY in .env}
      REQUIRE_AUTHENTICATION: ${REQUIRE_AUTHENTICATION:-true}
      ENFORCE_SECURITY: ${ENFORCE_SECURITY:-true}
      API_SERVICE_USER_NAME: ${API_SERVICE_USER_NAME:-integration}
      API_SERVICE_USER_GROUPS: ${API_SERVICE_USER_GROUPS:-SYSTEM}
      API_KEY: ${API_KEY:?set API_KEY in .env}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?set ADMIN_API_KEY in .env}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
    volumes:
      - processes:/workspace/apps/hrdemo/workflow/processes
      - hrdata:/workspace/apps/hrdemo/data
    restart: unless-stopped

  engine:
    build:
      context: ../..
      dockerfile: apps/docker-isolated-engine/Dockerfile
    image: ${BPMN_IMAGE:-bpmnserver-hrdemo:local}
    command: ["npx", "tsx", "engine.ts"]
    environment:
      PORT: "3001"
      MONGO_DB_URL: mongodb://mongo:27017/hrdemo
      DEFINITIONS_PATH: /workspace/apps/hrdemo/workflow/processes/
      ENGINE_PORT: "3001"
      ENGINE_LISTEN: 0.0.0.0
      ENGINE_KEY: ${ENGINE_KEY:?set ENGINE_KEY in .env}
      REQUIRE_AUTHENTICATION: ${REQUIRE_AUTHENTICATION:-true}
      ENFORCE_SECURITY: ${ENFORCE_SECURITY:-true}
      API_SERVICE_USER_NAME: ${API_SERVICE_USER_NAME:-integration}
      API_SERVICE_USER_GROUPS: ${API_SERVICE_USER_GROUPS:-SYSTEM}
      SECRETS_KEY: ${SECRETS_KEY:?set SECRETS_KEY in .env}
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - processes:/workspace/apps/hrdemo/workflow/processes:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3001/engine/call',{method:'POST',headers:{'x-engine-key':process.env.ENGINE_KEY},body:'{}'})
          .then(r=>process.exit(r.status===404?0:1)).catch(()=>process.exit(1))
      interval: 3s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  mongo:
    image: mongo:8.0
    command: ["--wiredTigerCacheSizeGB", "0.5"]
    volumes:
      - database:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  database:
  hrdata:
  processes:
