<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">Linux deployment options latency comparison</title>
  <desc id="desc">Median and p95 full host API latency for all-native, hybrid, all-Docker, and four shared-Mongo tenants.</desc>
  <rect width="1100" height="620" fill="#fff"/><text x="55" y="48" font-family="Arial" font-size="28" font-weight="700" fill="#172033">Linux deployment options</text><text x="55" y="78" font-family="Arial" font-size="16" fill="#526071">Full host API latency, milliseconds; lower is faster.</text>
  <line x1="120" y1="470" x2="1010" y2="470" stroke="#687386" stroke-width="2"/><line x1="120" y1="120" x2="120" y2="470" stroke="#687386" stroke-width="2"/>
  <g font-family="Arial" font-size="13" fill="#526071"><text x="90" y="475" text-anchor="end">0</text><text x="90" y="405" text-anchor="end">10</text><text x="90" y="335" text-anchor="end">20</text><text x="90" y="265" text-anchor="end">30</text><text x="90" y="195" text-anchor="end">40</text><text x="90" y="125" text-anchor="end">50 ms</text></g>
  <g stroke="#dce2ea"><line x1="120" y1="400" x2="1010" y2="400"/><line x1="120" y1="330" x2="1010" y2="330"/><line x1="120" y1="260" x2="1010" y2="260"/><line x1="120" y1="190" x2="1010" y2="190"/><line x1="120" y1="120" x2="1010" y2="120"/></g>
  <g fill="#4979c6"><rect x="150" y="390.3" width="38" height="79.7"/><rect x="370" y="390.4" width="38" height="79.6"/><rect x="590" y="385.4" width="38" height="84.6"/><rect x="810" y="332.9" width="38" height="137.1"/></g>
  <g fill="#e28a3b"><rect x="192" y="380.7" width="38" height="89.3"/><rect x="412" y="384.7" width="38" height="85.3"/><rect x="632" y="364.9" width="38" height="105.1"/><rect x="852" y="272.0" width="38" height="198.0"/></g>
  <g font-family="Arial" font-size="14" fill="#172033" text-anchor="middle"><text x="190" y="512">Native</text><text x="410" y="512">Hybrid</text><text x="630" y="512">All Docker</text><text x="850" y="512">4 shared Mongo</text><text x="169" y="380">11.39</text><text x="211" y="370">12.76</text><text x="389" y="380">11.37</text><text x="431" y="374">12.19</text><text x="609" y="375">12.09</text><text x="651" y="355">15.02</text><text x="829" y="323">19.59</text><text x="871" y="263">28.28</text></g>
  <g font-family="Arial" font-size="14" fill="#172033"><rect x="455" y="560" width="16" height="16" fill="#4979c6"/><text x="479" y="574">Median</text><rect x="600" y="560" width="16" height="16" fill="#e28a3b"/><text x="624" y="574">p95</text></g>
</svg>
