    tests: [packages/bpmn-server/test/engine.test.mjs, apps/testSampleApp/test/custom/buy-used-car.test.ts, apps/testSampleApp/test/custom/leave-application.test.ts]
    examples: [apps/testSampleApp/examples/invoice.test.ts]
  - id: service-task
