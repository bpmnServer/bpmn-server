# The features of bpmn-server, bpmn-web and bpmn-client: what each does, and where it is documented, coded and
# tested. scripts/features.mjs checks the references, tags the tests (a "// @features:" line at the top of each test
# file named here) and writes docs/docs/features.md.
#
#   npm run features            # check, tag the tests, write the page
#   npm run features -- --check # check only (fails on a broken reference)
#
# status: supported | partial (works, with limits: see `note`) | not-supported (loads, does not run: see `note`)
# paths are from the repository's root; a doc may name a heading (#its-anchor).

areas:
  modeling: Modeling — BPMN elements and their settings
  engine: Engine — running instances
  decisions: Decisions (DMN)
  connectors: Connectors — REST APIs
  data: Data and storage
  api: APIs and the client
  web: The web app — editor, Test tab, history
  pages: The web app — dashboards, instances, administration
  security: Security
  monitoring: Monitoring and logs
  performance: Performance and load
  cli: Command line
  install: Install, setup and deployment

features:
