  - id: add-ons
    area: engine
    name: "Add-ons"
    what: "What is built on the engine registers for the engine's own events (register(server): server.listener.subscribe; start, assign, wait, end, process.end) and registers what has no event in server.registrations (engine/AddOns.ts: model checks, decision lookups); the engine imports nothing of it, and an add-on imports no other add-on. Who works on a user task is set in one engine step, Execution.assignItem, which records what decided it and fires assign: the assignment add-on decides on start (attributes, lane, policy), a person by assign or claim. The assignment, notification and security policies are three add-ons (src/addons/assignment, notification, security, each its own folder; what they share, the actors, in src/addons/basics; `policies` in app-config.json is the three); a server has its configuration's addOns(server), by default the policies; addOns: () => [] is the engine alone; an application adds its own. A subscriber that throws is reported and fails nothing. The API fires its own events: pre-query (a listener adds conditions to context.conditions, narrowing a read) and pre-action (a listener may refuse an action by throwing); the Policies add-on listens. What is handed to the application's code and the add-ons is one context per call (engine/Context.ts: its source item, element, dmn, query or form; user, instance, element, item, data, input), forwarding to the execution for 3.x (deprecated); the case's actors are kept on it (instance.actors)."
    docs: [docs/design/add-ons.md, docs/design/context-object.md, docs/docs/add-ons/assignment.md, docs/docs/add-ons/security.md, docs/docs/add-ons/notification.md, docs/docs/add-ons/labels.md, docs/docs/add-ons/forms.md, docs/docs/add-ons/modeling.md, docs/docs/add-ons/ai.md]
    code: [packages/bpmn-server/src/engine/AddOns.ts, packages/bpmn-server/src/engine/Context.ts, packages/bpmn-server/src/API/API.ts, packages/bpmn-server/src/elements/FormRules.ts, packages/bpmn-server/src/addons/index.ts, packages/bpmn-server/src/common/DefaultConfiguration.ts]
    tests: [packages/bpmn-server/test/add-ons.test.mjs, packages/bpmn-server/test/context.test.mjs, apps/testSampleApp/test/web/add-ons.test.mjs, apps/testSampleApp/test/ui/modeler-add-ons.test.mjs]
  - id: assignment-policies
    area: modeling
    name: "Assignment policies"
    what: "A user task names a policy (owf:assignmentPolicy; camunda:, as saved before, is read too): a DMN table in assignment/<name>.dmn.xml whose first matching rule sets assignee, candidateUsers and candidateGroups when the task starts, an output a FEEL value or a $(...) expression; the policy wins; no match assigns nothing, the Rationale says why; roles.json lists the roles; verifyModel checks; chosen and previewed in the editor, edited and tested in the decision editor; roles edited on the Administration page."
    xml: ["[owf:assignmentPolicy]"]
    docs: [docs/docs/assignment-policies.md, docs/design/assignment.md]
    code: [packages/bpmn-server/src/addons/assignment/AssignmentPolicy.ts, packages/bpmn-server/src/addons/assignment/index.ts, packages/bpmn-web/modeler/src/addons/policies/PolicyEntries.jsx, packages/bpmn-web/src/routes/model.ts, packages/bpmn-web/src/routes/dashboards.ts]
    examples: [apps/hrdemo/workflow/processes/assignment/LeaveApproval.dmn.xml]
    tests: [packages/bpmn-server/test/assignment.test.mjs, apps/testSampleApp/test/web/assignment-policies.test.mjs, apps/testSampleApp/test/ui/assignment-policies.test.mjs]
  - id: security-policies
    area: security
    name: "Security policies"
    status: partial
    what: "A process (and a user task, for its actions) names a security policy (owf:securityPolicy): a DMN table in security/<name>.dmn.xml, hit policy COLLECT, every matching rule counted and a denial winning. Inputs: the names every expression reads: the user (user.userGroups), the instance's actors (actors.initiator, an owf:actor's), the task, the data (a task's: its item's, in its branch); actions: see (summary, full), data (all, forms, paths), claim, complete, restart, events. Without one, the application's security/default.dmn.xml, else a built-in default. Asked by API v3 (instances, tasks, claim, complete, restart, start events) and the pages (the Workbench's lists, the instance page, the task form); a refused action is a 403 POLICY_DENIED naming the rule. Off until an application has security/ or SECURITY_POLICY=default. A case a rule shows as a summary (see: summary) opens as one: its name, status and the tasks the person completed in it, none of its data."
    note: "A first slice: in the editor's Policies group of a process (a task's own is written in the XML), its actors checked by verifyModel (actor-unknown) but not yet its own checks, no As whom preview; a policy can deny claim and complete but not yet give them to someone the assignment doesn't offer the task to."
    xml: ["[owf:securityPolicy]"]
    docs: [docs/design/security-policies.md]
    code: [packages/bpmn-server/src/addons/security/SecurityPolicy.ts, packages/bpmn-server/src/addons/security/CaseAccess.ts, packages/bpmn-server/src/engine/DecisionContext.ts, packages/bpmn-web/src/routes/caseAccess.ts, packages/bpmn-web/src/routes/api/instances.ts, packages/bpmn-web/src/routes/api/tasks.ts, packages/bpmn-web/src/routes/workflow.ts]
  - id: notification-policies
