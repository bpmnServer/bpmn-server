site_name:  bpmnServer docs
docs_dir: docs
site_dir: site
site_url: https://bpmnserver.github.io/bpmn-server/
repo_url: https://github.com/bpmnServer/bpmn-server
theme:
  name: material
  custom_dir: overrides
  favicon: favicon.ico
  features:
    - content.tooltips
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.breadcrumbs
    - navigation.expand
    - toc.integrate
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
    - navigation.footer
  language: en
  palette:
    - scheme: default
      toggle:
        icon: material/toggle-switch-off-outline 
        name: Switch to dark mode
      primary: teal
      accent: purple 
    - scheme: slate 
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode    
      primary: teal
      accent: lime

plugins:
  - search
  # pages retired or merged: their old addresses lead to what replaced them
  - redirects:
      redirect_maps:
        journeys.md: index.md
        design changes.md: whats-new-3.md
        executionStructure.md: execution.md
        bpmn-changes.md: examples.md
        dt.md: decisions.md
        bpmn/intro.md: examples.md
        examples/BuyCar-Server.md: examples/buy-used-car.md
        examples/BuyCar-Remote.md: examples/buy-used-car.md
        examples/BuyCar-Web.md: examples/buy-used-car.md
        application-integration-design.md: 'https://github.com/bpmnServer/bpmn-server/blob/main/docs/design/application-integration-design.md'
markdown_extensions:
  - toc:
      permalink: "#" 
  - attr_list
  - abbr
  - md_in_html
  - tables
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.mark

use_directory_urls: true

# the include script's test files (npm run incl), not pages
exclude_docs: |
  example1.md
  example1.out
  include1.md
  *.output
  *.mmd

# Pages for features not released yet: shown by `mkdocs serve`, left out of `mkdocs build` and `gh-deploy`.
# At release, move a page out of drafts/ and add it to the nav.
draft_docs: |
  drafts/


